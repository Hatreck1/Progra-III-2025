<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ventas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
  <h3>Ventas</h3>
  <table class="table">
    <tr>
      <th>Marca</th><th>Modelo</th><th>Precio</th><th>Vendedor</th><th>Fecha</th>
    </tr>
    {% for v in ventas %}
    <tr>
      <td>{{v.marca}}</td>
      <td>{{v.modelo}}</td>
      <td>{{v.precio}}</td>
      <td>{{v.vendedor}}</td>
      <td>{{v.fecha_venta}}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
