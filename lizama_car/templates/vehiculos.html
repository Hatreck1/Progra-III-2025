<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vehículos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
  <h3>Vehículos</h3>
  <form method="POST" action="/vehiculos/add" enctype="multipart/form-data" class="mb-3">
    <input type="text" name="marca" placeholder="Marca" required>
    <input type="text" name="modelo" placeholder="Modelo" required>
    <input type="number" name="anio" placeholder="Año" required>
    <input type="number" name="precio" placeholder="Precio" required>
    <input type="file" name="imagen" required>
    <button type="submit" class="btn btn-primary">Agregar</button>
  </form>
  <table class="table">
    <tr>
      <th>Marca</th><th>Modelo</th><th>Año</th><th>Precio</th><th>Imagen</th><th>Acciones</th>
    </tr>
    {% for v in vehiculos %}
    <tr>
      <td>{{v.marca}}</td>
      <td>{{v.modelo}}</td>
      <td>{{v.anio}}</td>
      <td>{{v.precio}}</td>
      <td><img src="/{{v.imagen}}" width="100"></td>
      <td>
        <a href="/vehiculos/vender/{{v._id}}" class="btn btn-success btn-sm">Vender</a>
        <a href="/vehiculos/delete/{{v._id}}" class="btn btn-danger btn-sm">Eliminar</a>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
