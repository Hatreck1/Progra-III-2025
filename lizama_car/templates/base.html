<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Lizama Car{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      padding-top: 70px;
      background: #f4f4f4;
    }
    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }
    .content {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">Lizama Car</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('mostrar_vehiculos') }}">Vehículos</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('mostrar_ventas') }}">Ventas</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('mostrar_usuarios') }}">Usuarios</a></li>
         <li class="nav-item"><a class="nav-link" href="{{ url_for('mostrar_renta') }}">Renta</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('mostrar_rentados') }}">Rentados</a></li>

        </ul>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Cerrar Sesión</a>
      </div>
    </div>
  </nav>

  <div class="container content">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    if (window.history.replaceState) {
      window.history.replaceState(null, null, window.location.href);
    }
    window.onpageshow = function(event) {
      if (event.persisted) {
        window.location.reload();
      }
    };
  </script>

</body>
</html>
