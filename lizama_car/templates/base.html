<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Lizama Car{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo_color_trifuerza.svg') }}">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/phosphor-icons@1.4.1/src/css/phosphor.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style_dashboard.css') }}">  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style_login.css') }}"> 
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style_register.css') }}"> 
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style_renta.css') }}">  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style_tablas.css') }}">  
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_footer.css') }}">  

  <style>
    body {
    background-color: hsla(65, 60%, 97%, 1);
    background-image: radial-gradient(circle at 12% 15%, hsla(81, 82%, 98%, 1) 3%, transparent 59%), radial-gradient(circle at 92% 93%, rgb(245, 219, 219) 11%, transparent 79%), radial-gradient(circle at 24% 86%, hsla(13, 52%, 90%, 1) 16%, transparent 83%), radial-gradient(circle at 11% 94%, hsla(43, 55%, 90%, 1) 16%, transparent 51%), radial-gradient(circle at 44% 9%, hsla(0, 81%, 51%, 0.05) 13%, transparent 83%);
    background-blend-mode: normal, normal, normal, normal, normal;
    }
    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }
    .content {
      margin-top: 20px;
    }

      .custom-navbar {
    background-color: #E43636 !important;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .custom-navbar .navbar-brand,
  .custom-navbar .nav-link {
    color: #ffffff !important;
    font-weight: 600;
    transition: color 0.2s ease;
  }

  .custom-navbar .nav-link:hover {
    color: rgba(255,255,255,0.8) !important;
  }

  .custom-navbar .navbar-toggler {
    border-color: rgba(255,255,255,0.5);
  }

  .custom-navbar .navbar-toggler-icon {
    background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba%28255, 255, 255, 1%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/ %3E%3C/svg%3E");
  }

  .custom-navbar .nav-link.active {
    color: #f9eca3 !important;  /* Amarillo para destacar */
    font-weight: 700;
    border-bottom: 2px solid #FFD700; 
  }

  .btn-logout {
    background-color: #1b1a1a;
    color: #fff;
    font-weight: 600;
    border-radius: 10px;
    padding: 5px 15px;
    transition: background-color 0.2s ease;
  }

  .btn-logout:hover {
    background-color: #000;
    color: #fff;
  }
  </style>
</head>
<body>

  {% if not hide_navbar %}
<nav class="navbar navbar-expand-lg custom-navbar fixed-top">
  <div class="container-fluid">
    <img src="{{ url_for('static', filename='img/logo_color_trifuerza.svg') }}"  alt="" style="width: 30px; filter:brightness(100); margin-right: 8px;">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">Lizama Car</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('mostrar_vehiculos') }}">Vehículos</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('mostrar_ventas') }}">Ventas</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('mostrar_usuarios') }}">Usuarios</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('mostrar_renta') }}">Renta</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('mostrar_rentados') }}">Rentados</a></li>
      </ul>
      <a href="{{ url_for('logout') }}" class="btn btn-logout">
        Cerrar Sesión
        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="auto" fill="#fff" viewBox="0 0 256 256"><path d="M120,216a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V40a8,8,0,0,1,8-8h64a8,8,0,0,1,0,16H56V208h56A8,8,0,0,1,120,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L204.69,120H112a8,8,0,0,0,0,16h92.69l-26.35,26.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,229.66,122.34Z"></path></svg>
      </a>
    </div>
  </div>
</nav>
  {% endif %}


  <div class="container content">
    {% block content %}{% endblock %}
  </div>

  <!-- FOOTER -->
  <footer class="footer-custom">
    <div class="container text-center py-3">
      <span class="footer-text">© 2025 Lizama Car. Todos los derechos reservados.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    if (window.history.replaceState) {
      window.history.replaceState(null, null, window.location.href);
    }
    window.onpageshow = function(event) {
      if (event.persisted) {
        window.location.reload();
      }
    };
  </script>

  <script>
    // Detecta la URL actual
    const currentPath = window.location.pathname;

    // Selecciona todos los enlaces del menú
    document.querySelectorAll(".navbar-nav .nav-link").forEach(link => {
      // Si el href coincide con la ruta actual, marca como activo
      if (link.getAttribute("href") === currentPath) {
        link.classList.add("active");
      }
    });
  </script>


</body>
</html>
