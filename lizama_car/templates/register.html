{% extends "base.html" %}

{% block title %}Crear Cuenta - Lizama Car{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h3 class="text-center mb-3">Crear Cuenta</h3>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <input type="text" name="nuevo_usuario" class="form-control" placeholder="Nuevo Usuario" required>
      </div>
      <div class="mb-3">
        <input type="password" name="nueva_password" class="form-control" placeholder="Nueva Contraseña" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Crear Cuenta</button>
    </form>
    <p class="text-center mt-2"><a href="/">Volver al login</a></p>
  </div>
</div>
{% endblock %}
