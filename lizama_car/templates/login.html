{% extends "base.html" %}

{% block title %}Login - Lizama Car{% endblock %}

{% block content %}
<div class="fondo_login"></div>

<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="login-card shadow-lg border-0">
    <!-- Imagen izquierda -->
    <div class="img_login">
      <img src="{{ url_for('static', filename='img/img_carro_login.jpg') }}" alt="carr_log">
    </div>
    <!-- Formulario derecha -->
    <div class="cont_form_login p-5">
      <img src="{{ url_for('static', filename='img/logo_color_trifuerza.svg') }}" alt="" class="img_logo_trifuerza">
      <h4 class="text-danger fw-bold m-0">Lizama Car</h4>
      <div class="cont_in_linea">
        <h3 class="text-center text-danger mb-4 lbl_inic_s">Iniciar sesión</h3>
      </div>
      
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="usuario" class="form-control" id="form-login" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" id="form-login" required>
        </div>
        <button type="submit" class="btn btn-danger" id="btn-entrar">Entrar</button>
      </form>
      <hr>
      <!--<p class="text-center">¿No tienes cuenta? <a href="/register" class="a_redireccion_crear">Crea una aquí</a></p>-->
    </div>
  </div>
</div>
{% endblock %}
