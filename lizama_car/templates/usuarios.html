<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuarios</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
  <h3>Usuarios</h3>
  <form method="POST" action="/usuarios/add" class="mb-3">
    <input type="text" name="usuario" placeholder="Usuario" required>
    <input type="password" name="password" placeholder="Contraseña" required>
    <button type="submit" class="btn btn-primary">Agregar</button>
  </form>
  <table class="table">
    <tr>
      <th>Usuario</th><th>Rol</th><th>Fecha de Creación</th><th>Acciones</th>
    </tr>
    {% for u in usuarios %}
    <tr>
      <td>{{ u.username }}</td>
      <td>{{ u.rol }}</td>
      <td>{{ u.fecha_creacion.strftime('%Y-%m-%d %H:%M:%S') if u.fecha_creacion else '' }}</td>
      <td>
        <a href="/usuarios/delete/{{ u._id }}" class="btn btn-danger btn-sm">Eliminar</a>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
